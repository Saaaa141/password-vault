<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>密码保险箱 · Pro</title>
<style>
.app[data-theme="dark"]{--bg:#05070d;--card:#121826;--card-hi:#1a2236;--border:rgba(255,255,255,.06);--border-hi:rgba(255,255,255,.14);--txt-1:#f1f5f9;--txt-2:#94a3b8;--txt-3:#475569;--input-bg:#0a0e17;--shadow-card:0 4px 20px rgba(0,0,0,.5);--nav-bg:rgba(10,14,23,.94);--accent:#6366f1;--accent-grad:linear-gradient(135deg,#6366f1,#8b5cf6);--ok:#34d399;--warn:#fbbf24;--bad:#f43f5e;--aura-1:rgba(99,102,241,.28);--aura-2:rgba(139,92,246,.22);--aura-3:rgba(59,130,246,.16);--grid:rgba(255,255,255,.02)}
.app[data-theme="light"]{--bg:#f5f7fb;--card:#fff;--card-hi:#f8fafc;--border:rgba(15,23,42,.06);--border-hi:rgba(15,23,42,.14);--txt-1:#0f172a;--txt-2:#64748b;--txt-3:#94a3b8;--input-bg:#f1f5f9;--shadow-card:0 2px 12px rgba(15,23,42,.06);--nav-bg:rgba(255,255,255,.97);--accent:#6366f1;--accent-grad:linear-gradient(135deg,#6366f1,#8b5cf6);--ok:#10b981;--warn:#f59e0b;--bad:#e11d48;--aura-1:rgba(99,102,241,.15);--aura-2:rgba(139,92,246,.12);--aura-3:rgba(59,130,246,.1);--grid:rgba(15,23,42,.015)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html,body{height:100%;overflow:hidden}
body{background:#05070d;display:flex;justify-content:center;align-items:center}
.aura-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aura-bg .a{position:absolute;border-radius:50%;filter:blur(110px);animation:breathe 12s ease-in-out infinite}
.aura-bg .a1{width:340px;height:340px;background:var(--aura-1);top:-80px;left:-100px}
.aura-bg .a2{width:300px;height:300px;background:var(--aura-2);bottom:-80px;right:-80px;animation-delay:-4s}
.aura-bg .a3{width:220px;height:220px;background:var(--aura-3);top:40%;left:30%;animation-delay:-8s}
@keyframes breathe{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fingerPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(99,102,241,.5)}50%{transform:scale(1.03);box-shadow:0 0 0 18px rgba(99,102,241,0)}}
@keyframes pwdIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.app{position:relative;max-width:440px;width:100%;height:100%;background:var(--bg);color:var(--txt-1);display:flex;flex-direction:column;overflow:hidden;transition:background .3s,color .3s;z-index:1}
.app::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%)}
.topbar{padding:18px 20px 10px;flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;position:relative;z-index:3}
.topbar-l{flex:1;min-width:0}
.topbar-kicker{font-size:.68rem;font-weight:700;color:var(--txt-3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.topbar-kicker .dot{width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
.topbar-title{font-size:1.75rem;font-weight:800;letter-spacing:-.9px;color:var(--txt-1);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-r{display:flex;gap:7px;flex-shrink:0;padding-bottom:2px}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .1s;box-shadow:var(--shadow-card)}
.icon-btn:active{transform:scale(.92);background:var(--card-hi)}
.icon-btn svg{width:17px;height:17px;stroke:var(--txt-2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab-page{flex:1;display:none;flex-direction:column;overflow:hidden;padding-bottom:78px;position:relative;z-index:2}
.tab-page.active{display:flex}
.tools{padding:0 20px 8px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 14px;transition:border-color .2s,background .2s;box-shadow:var(--shadow-card)}
.search:focus-within{border-color:rgba(99,102,241,.5);background:var(--card-hi)}
.search svg{width:15px;height:15px;stroke:var(--txt-3);fill:none;stroke-width:2;flex-shrink:0}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt-1);font-size:.86rem}
.search input::placeholder{color:var(--txt-3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);color:var(--txt-2);font-size:.74rem;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s}
.chip.active{border-color:rgba(99,102,241,.6);background:rgba(99,102,241,.14);color:#a5b4fc}
.sub-tools{display:flex;gap:6px}
.sel-wrap{position:relative;flex:1}
.sel-wrap select{-webkit-appearance:none;appearance:none;width:100%;padding:8px 28px 8px 11px;font-size:.76rem;font-weight:600;font-family:inherit;background:var(--card);color:var(--txt-2);border:1px solid var(--border);border-radius:9px;outline:none;cursor:pointer}
.sel-wrap::after{content:"";position:absolute;right:11px;top:50%;margin-top:-2px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--txt-3);pointer-events:none}
.mini-tool{padding:8px 11px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--txt-2);font-size:.76rem;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap}
.mini-tool.active{background:rgba(99,102,241,.14);border-color:rgba(99,102,241,.5);color:#a5b4fc}
.mini-tool.starred.active{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.5);color:#fbbf24}
.mini-tool:active{transform:scale(.96)}
.recent-section{padding:0 20px 6px;flex-shrink:0;display:none}
.recent-section.show{display:block}
.recent-title{font-size:.7rem;font-weight:700;color:var(--txt-3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.recent-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.recent-scroll::-webkit-scrollbar{display:none}
.recent-chip{flex-shrink:0;display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px 8px 8px;cursor:pointer;transition:background .15s,transform .1s;box-shadow:var(--shadow-card);max-width:160px}
.recent-chip:active{transform:scale(.96);background:var(--card-hi)}
.recent-chip .rc-avatar{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.66rem;color:#fff}
.recent-chip .rc-name{font-size:.78rem;font-weight:600;color:var(--txt-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{flex:1;overflow-y:auto;padding:4px 20px 100px;-webkit-overflow-scrolling:touch}
.list::-webkit-scrollbar{display:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer;position:relative;transition:background .15s,border-color .15s,transform .1s;box-shadow:var(--shadow-card);animation:cardIn .35s ease backwards}
.card:active{transform:scale(.99);background:var(--card-hi);border-color:var(--border-hi)}
.card.batch{padding-left:44px}
.card-check{position:absolute;left:13px;top:50%;margin-top:-10px;width:20px;height:20px;border-radius:6px;border:2px solid var(--border-hi);display:none;align-items:center;justify-content:center;background:var(--card)}
.card.batch .card-check{display:flex}
.card.checked .card-check{background:var(--accent);border-color:var(--accent)}
.card.checked .card-check::after{content:"";width:4px;height:8px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg);margin-top:-2px}
.card-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.avatar{width:42px;height:42px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;color:#fff;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.avatar::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 60%)}
.avatar.c-social{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
.avatar.c-mail{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
.avatar.c-bank{background:linear-gradient(135deg,#10b981,#34d399)}
.avatar.c-shop{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.avatar.c-work{background:linear-gradient(135deg,#06b6d4,#22d3ee)}
.avatar.c-other{background:linear-gradient(135deg,#64748b,#94a3b8)}
.card-meta{flex:1;min-width:0}
.card-service{font-size:.94rem;font-weight:650;color:var(--txt-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.card-user{font-size:.7rem;color:var(--txt-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.card-user .sep{width:3px;height:3px;border-radius:50%;background:var(--txt-3)}
.star-btn{width:30px;height:30px;border-radius:8px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s}
.star-btn:active{transform:scale(.85)}
.star-btn svg{width:17px;height:17px;stroke:var(--txt-3);fill:none;stroke-width:2;stroke-linejoin:round}
.star-btn.active svg{stroke:#fbbf24;fill:#fbbf24}
.card-pwd{display:flex;align-items:center;gap:6px;background:var(--input-bg);border-radius:10px;padding:7px 7px 7px 12px}
.pwd-text{flex:1;font-family:monospace;font-size:.83rem;color:var(--txt-2);letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pwd-text.visible{font-family:system-ui,sans-serif;color:var(--txt-1);letter-spacing:.3px}
.strength{display:flex;gap:2px;flex-shrink:0}
.strength i{display:block;width:3px;height:11px;border-radius:2px;background:var(--border)}
.strength.s1 i:nth-child(1){background:var(--bad)}
.strength.s2 i:nth-child(1),.strength.s2 i:nth-child(2){background:var(--warn)}
.strength.s3 i{background:var(--ok)}
.mini-btn{width:28px;height:28px;border-radius:7px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s,transform .1s}
.mini-btn:active{background:rgba(99,102,241,.15);transform:scale(.9)}
.mini-btn svg{width:13px;height:13px;stroke:var(--txt-3);fill:none;stroke-width:2}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:55px 20px;text-align:center}
.empty-icon{width:84px;height:84px;border-radius:24px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card)}
.empty-icon svg{width:36px;height:36px;stroke:var(--txt-2);fill:none;stroke-width:1.6}
.empty-title{font-size:.98rem;font-weight:700;color:var(--txt-1)}
.empty-desc{font-size:.78rem;color:var(--txt-3);line-height:1.6;max-width:230px}
.batch-bar{position:absolute;bottom:78px;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:11px 20px;display:none;align-items:center;gap:9px;box-shadow:0 -4px 20px rgba(0,0,0,.15);z-index:12}
.batch-bar.show{display:flex}
.batch-bar .bb-count{flex:1;font-size:.83rem;font-weight:600;color:var(--txt-2)}
.batch-bar button{padding:8px 14px;border-radius:9px;border:none;font-size:.8rem;font-weight:650;cursor:pointer;font-family:inherit}
.bb-all{background:rgba(99,102,241,.15);color:#a5b4fc}
.bb-del{background:rgba(244,63,94,.15);color:#fda4af}
.bb-cancel{background:var(--input-bg);color:var(--txt-2)}
.gen-page{flex:1;overflow-y:auto;padding:4px 20px 20px}
.gen-page::-webkit-scrollbar{display:none}
.gen-display{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px 16px;text-align:center;margin-bottom:12px;box-shadow:var(--shadow-card)}
.gen-pwd{font-family:monospace;font-size:1.18rem;font-weight:600;color:var(--txt-1);letter-spacing:1.5px;word-break:break-all;line-height:1.6;min-height:58px;display:flex;align-items:center;justify-content:center}
.gen-pwd.pulse{animation:fingerPulse .5s ease}
.gen-strength{margin-top:9px;display:flex;justify-content:center;gap:3px}
.gen-strength i{width:22px;height:4px;border-radius:2px;background:var(--border)}
.gen-strength.s1 i:nth-child(1){background:var(--bad)}
.gen-strength.s2 i:nth-child(1),.gen-strength.s2 i:nth-child(2){background:var(--warn)}
.gen-strength.s3 i{background:var(--ok)}
.gen-actions{display:flex;gap:8px;margin-top:14px}
.gen-actions button{flex:1;padding:11px;border-radius:10px;border:none;font-size:.83rem;font-weight:650;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;transition:transform .1s}
.gen-actions button:active{transform:scale(.97)}
.gen-refresh{background:var(--input-bg);color:var(--txt-2)}
.gen-copy{background:var(--accent-grad);color:#fff}
.gen-actions button svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gen-config{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:11px;box-shadow:var(--shadow-card)}
.gen-config h4{font-size:.82rem;font-weight:700;color:var(--txt-2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.gen-len-val{color:var(--accent);font-weight:800;font-size:.88rem}
.slider{-webkit-appearance:none;width:100%;height:5px;border-radius:3px;background:var(--border);outline:none;margin-bottom:14px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent-grad);cursor:pointer;border:3px solid var(--card);box-shadow:0 2px 8px rgba(99,102,241,.4)}
.gen-toggles{display:flex;flex-direction:column;gap:9px}
.toggle-row{display:flex;align-items:center;gap:10px;cursor:pointer;padding:3px 0}
.toggle-switch{position:relative;width:38px;height:21px;border-radius:11px;background:var(--border-hi);transition:background .2s;flex-shrink:0}
.toggle-switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-row.on .toggle-switch{background:var(--accent)}
.toggle-row.on .toggle-switch::after{transform:translateX(17px)}
.toggle-label{font-size:.8rem;color:var(--txt-2);font-weight:500;flex:1}
.security-page{flex:1;overflow-y:auto;padding:0 20px 20px}
.security-page::-webkit-scrollbar{display:none}
.score-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px 18px;margin-bottom:12px;display:flex;align-items:center;gap:18px;box-shadow:var(--shadow-card)}
.score-ring{width:96px;height:96px;position:relative;flex-shrink:0}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--border);stroke-width:9}
.ring-fg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.score-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-num{font-size:1.55rem;font-weight:800;line-height:1}
.score-label{font-size:.58rem;color:var(--txt-3);font-weight:600;margin-top:3px}
.score-info{flex:1;min-width:0}
.score-info h3{font-size:.98rem;font-weight:700;margin-bottom:5px}
.deduction-list{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.deduction-item{display:flex;justify-content:space-between;font-size:.68rem;color:var(--txt-3)}
.deduction-item .dv{font-weight:700}
.deduction-item .dv.bad{color:var(--bad)}
.deduction-item .dv.warn{color:var(--warn)}
.deduction-item .dv.ok{color:var(--ok)}
.dist-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.dist-card h4{font-size:.78rem;font-weight:700;color:var(--txt-2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.dist-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.72rem}
.dist-row:last-child{margin-bottom:0}
.dist-label{width:36px;color:var(--txt-3);font-weight:600;flex-shrink:0}
.dist-bar-wrap{flex:1;height:6px;background:var(--input-bg);border-radius:3px;overflow:hidden}
.dist-bar{height:100%;border-radius:3px;transition:width .5s ease}
.dist-value{width:24px;text-align:right;color:var(--txt-2);font-weight:700}
.stat-grid{display:flex;gap:7px;margin-bottom:12px}
.stat-item{flex:1;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 8px;text-align:center;box-shadow:var(--shadow-card)}
.stat-item .sv{font-size:1.15rem;font-weight:800;line-height:1;margin-bottom:3px}
.stat-item .sl{font-size:.64rem;color:var(--txt-3);font-weight:600}
.stat-item.t-ok .sv{color:var(--ok)}
.stat-item.t-warn .sv{color:var(--warn)}
.stat-item.t-bad .sv{color:var(--bad)}
.stat-item.t-fav .sv{color:#fbbf24}
.issue-group{background:var(--card);border:1px solid var(--border);border-radius:15px;overflow:hidden;margin-bottom:9px;box-shadow:var(--shadow-card)}
.issue-head{padding:12px 15px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);cursor:pointer}
.issue-icon{width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.issue-icon svg{width:13px;height:13px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.issue-icon.danger{background:rgba(244,63,94,.12)}
.issue-icon.danger svg{stroke:var(--bad)}
.issue-icon.warn{background:rgba(251,191,36,.12)}
.issue-icon.warn svg{stroke:var(--warn)}
.issue-icon.info{background:rgba(99,102,241,.12)}
.issue-icon.info svg{stroke:#a5b4fc}
.issue-head h4{font-size:.82rem;font-weight:650;flex:1;color:var(--txt-1)}
.issue-head .count{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--input-bg);color:var(--txt-2)}
.issue-body{display:none}
.issue-group.expanded .issue-body{display:block}
.issue-item{padding:10px 15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);cursor:pointer}
.issue-item:last-child{border-bottom:none}
.issue-item:active{background:var(--card-hi)}
.issue-item .ii-avatar{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.74rem;color:#fff;flex-shrink:0}
.issue-item .ii-meta{flex:1;min-width:0}
.issue-item .ii-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.issue-item .ii-sub{font-size:.66rem;color:var(--txt-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.issue-empty{padding:16px 15px;text-align:center;font-size:.76rem;color:var(--ok)}
.settings-page{flex:1;overflow-y:auto;padding:0 20px 20px}
.settings-page::-webkit-scrollbar{display:none}
.set-group{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:11px;box-shadow:var(--shadow-card)}
.set-group-title{font-size:.68rem;font-weight:700;color:var(--txt-3);padding:13px 17px 5px;text-transform:uppercase;letter-spacing:.5px}
.set-item{padding:13px 17px;display:flex;align-items:center;gap:11px;cursor:pointer;border-bottom:1px solid var(--border);font-size:.84rem;color:var(--txt-1)}
.set-item:last-child{border-bottom:none}

/* ========== Base32 / TOTP ========== */
function base32Decode(input){
  var alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  input=input.toUpperCase().replace(/=+$/,'').replace(/\s/g,'');
  var bits=0,value=0,out=[];
  for(var i=0;i<input.length;i++){
    var idx=alphabet.indexOf(input.charAt(i));
    if(idx===-1)continue;
    value=(value<<5)|idx;bits+=5;
    if(bits>=8){out.push((value>>>(bits-8))&0xff);bits-=8;}
  }
  return out;
}
function generateTOTP(secretBase32,period){
  if(!hasCrypto)return Promise.resolve(null);

  if(!key||key.length===0)return Promise.resolve(null);
  var epoch=Math.floor(Date.now()/1000);
  var counter=Math.floor(epoch/(period||30));
  var counterBytes=[];
  for(var i=7;i>=0;i--){counterBytes.push((counter>>>(i*8))&0xff);}
  try{
    var keyBytes=new Uint8Array(key);
    var counterArr=new Uint8Array(counterBytes);
    return crypto.subtle.importKey('raw',keyBytes,{name:'HMAC',hash:'SHA-1'},false,['sign'])
      .then(function(k){return crypto.subtle.sign('HMAC',k,counterArr);})
      .then(function(sig){
        var h=new Uint8Array(sig);
        var offset=h[h.length-1]&0x0f;
        var code=((h[offset]&0x7f)<<24)|((h[offset+1]&0xff)<<16)|((h[offset+2]&0xff)<<8)|(h[offset+3]&0xff);
        var otp=code%1000000;var str=String(otp);while(str.length<6)str='0'+str;return str;
      }).catch(function(){return null;});
  }catch(e){return Promise.resolve(null);}
}

/* ========== AES ========== */
function deriveKey(password,salt){
  if(!hasCrypto)return null;

function aesEncrypt(plaintext,password){

    combined.set(iv,saltBytes.length+1);combined.set(cipher,saltBytes.length+1+12);
    var binary='';for(var i=0;i<combined.length;i++)binary+=String.fromCharCode(combined[i]);

  });
}
function aesDecrypt(cipherB64,password){

function registerBiometric(){

          pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
          authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred',requireResidentKey:false},

  });

/* ========== 状态 ========== */
var state={
  items:[],trash:[],visible:{},keyword:'',cat:'all',tab:'vault',
  editingId:null,masterHash:null,lastActivity:Date.now(),
  pendingConfirm:null,locked:true,firstSetup:false,
  sortBy:'updated',starFilter:false,batchMode:false,selected:{},
  settings:{autoLockMin:5,theme:'dark',expireDays:180},
  genPwd:'',genLen:16,genOpts:{upper:true,lower:true,numbers:true,symbols:true,exclude:false},
  totpIntervals:{},
  bioEnabled:false,bioCredId:null,
  showPwdForm:false
};
function vHas(id){return state.visible[id]===true;}
function vAdd(id){state.visible[id]=true;}
function vDel(id){delete state.visible[id];}
function vClear(){state.visible={};}
function isSelected(id){return state.selected[id]===true;}
function toggleSelect(id){if(state.selected[id])delete state.selected[id];else state.selected[id]=true;}
function clearSelection(){state.selected={};}
function selectedCount(){var c=0;for(var k in state.selected){if(state.selected.hasOwnProperty(k))c++;}return c;}

/* ========== 存储 ========== */
function loadAll(){
  try{
    var raw=store.get(KEY_ITEMS);var arr=raw?JSON.parse(raw):[];state.items=[];
    if(Object.prototype.toString.call(arr)==='[object Array]'){
      for(var i=0;i<arr.length;i++){var x=arr[i];
        if(x&&x.id&&x.service){state.items.push({id:x.id,service:x.service||'',user:x.user||'',pwd:x.pwd||'',cat:x.cat||'other',favorite:x.favorite===true,note:x.note||'',totp:x.totp||'',lastUsedAt:x.lastUsedAt||0,history:Object.prototype.toString.call(x.history)==='[object Array]'?x.history:[],createdAt:x.createdAt||Date.now(),updatedAt:x.updatedAt||x.createdAt||Date.now()});}
      }
    }
  }catch(e){state.items=[];}
  try{
    var rawT=store.get(KEY_TRASH);var arrT=rawT?JSON.parse(rawT):[];state.trash=[];
    if(Object.prototype.toString.call(arrT)==='[object Array]'){
      var now=Date.now();
      for(var j=0;j<arrT.length;j++){var t=arrT[j];if(t&&t.id&&t.service&&t.deletedAt&&(now-t.deletedAt)<30*864e5)state.trash.push(t);}
    }
  }catch(e){state.trash=[];}
  try{
    state.masterHash=store.get(KEY_MASTER)||null;
    var s=store.get(KEY_SETTINGS);
    if(s){var parsed=JSON.parse(s);
      if(parsed.autoLockMin!==undefined)state.settings.autoLockMin=parsed.autoLockMin;
      if(parsed.theme)state.settings.theme=parsed.theme;
      if(parsed.expireDays!==undefined)state.settings.expireDays=parsed.expireDays;
    }
  }catch(e){}
  try{
    var bio=store.get(KEY_BIO);
    if(bio){var b=JSON.parse(bio);state.bioEnabled=b.enabled===true;state.bioCredId=b.credId||null;}
  }catch(e){}
  state.firstSetup=!state.masterHash;
}
function saveItems(){try{store.set(KEY_ITEMS,JSON.stringify(state.items));}catch(e){toast('存储失败');}}
function saveTrash(){try{store.set(KEY_TRASH,JSON.stringify(state.trash));}catch(e){}}
function saveSettings(){try{store.set(KEY_SETTINGS,JSON.stringify(state.settings));}catch(e){}}
function saveBio(){try{store.set(KEY_BIO,JSON.stringify({enabled:state.bioEnabled,credId:state.bioCredId}));}catch(e){}}

/* ========== 主题 ========== */
function applyTheme(theme){
  state.settings.theme=theme;
  try{$('app').setAttribute('data-theme',theme);}catch(e){}

    if(icon){
      if(theme==='dark')icon.innerHTML='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';

/* ========== 锁屏（核心改造区） ========== */
function simpleHash(str){var h=5381;for(var i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0;}var hex=(h>>>0).toString(16);while(hex.length<8)hex='0'+hex;return hex;}

function renderLock(){
  var lt=$('lockTitle'),ls=$('lockSub'),le=$('lockErr'),lf=$('lockForm'),lsc=$('lockScreen');
  if(!lt||!ls||!le||!lf)return;
  le.textContent='';
  // 清理锁屏点击事件
  if(lsc)lsc.onclick=null;

  /* ===== 首次创建保险箱 ===== */
  if(state.firstSetup){
    lt.textContent='创建保险箱';
    ls.textContent='设置主密码（至少 6 位）';
    lf.innerHTML=
      '<input type="password" id="lockInput1" class="lock-input" placeholder="设置主密码（至少6位）">'
      +'<input type="password" id="lockInput2" class="lock-input" placeholder="再次输入确认">'
      +'<button class="lock-btn" id="lockBtn">创建保险箱</button>';
    var btn1=$('lockBtn');
    if(btn1)btn1.onclick=function(ev){
      if(ev)ev.stopPropagation();
      var p1=$('lockInput1').value,p2=$('lockInput2').value;
      if(p1.length<6){le.textContent='主密码至少 6 位';return;}
      if(p1!==p2){le.textContent='两次输入不一致';return;}
      var h=simpleHash(p1);
      store.set(KEY_MASTER,h);
      state.masterHash=h;state.firstSetup=false;
      // 关键：能开指纹就自动进指纹设置引导
      if(bioDiag.ok&&platformAuthAvailable){
        setTimeout(showBioSetupGuide,200);
      }else{
        unlock();
        toast('保险箱已创建');
        setTimeout(function(){
          toast(bioDiag.ok?'可在设置中开启指纹解锁':'当前环境不支持指纹，可在 HTTPS 环境下使用');
        },1600);
      }
    };
    var i1=$('lockInput1');
    if(i1)setTimeout(function(){try{i1.focus();}catch(e){}},300);
    if(i1)i1.addEventListener('click',function(ev){ev.stopPropagation();});
    var i2=$('lockInput2');
    if(i2)i2.addEventListener('click',function(ev){ev.stopPropagation();});
    return;
  }

  /* ===== 指纹模式（默认） ===== */
  var useBio=state.bioEnabled&&state.bioCredId&&bioDiag.ok;
  if(useBio&&!state.showPwdForm){
    lt.textContent='轻触解锁';
    ls.textContent='使用指纹快速打开保险箱';
    lf.innerHTML=
      '<button class="bio-btn" id="bioBtn" type="button">'+I.finger+'</button>'
      +'<div class="bio-hint" id="bioHint">点击指纹图标，或轻触屏幕任意位置</div>'
      +'<div class="pwd-toggle-link" id="pwdToggleBtn">'+I.keyboard+' 使用主密码解锁</div>';

    var bioBtn=$('bioBtn'), bioHint=$('bioHint');
    var handleBio=function(){
      if(!bioBtn)return;
      if(bioBtn.className.indexOf('loading')!==-1)return;
      bioBtn.className='bio-btn loading';
      if(bioHint){bioHint.className='bio-hint';bioHint.textContent='正在验证指纹...';}
      le.textContent='';
      verifyBiometric(state.bioCredId).then(function(res){
        if(res.ok){
          if(bioBtn)bioBtn.className='bio-btn';
          unlock();
        }else{
          if(bioBtn)bioBtn.className='bio-btn error';
          if(bioHint){bioHint.className='bio-hint error';bioHint.textContent=res.reason||'验证失败';}
          setTimeout(function(){
            if(bioBtn)bioBtn.className='bio-btn';
            if(bioHint){bioHint.className='bio-hint';bioHint.textContent='点击指纹图标，或轻触屏幕任意位置';}
          },1600);
        }
      });
    };

    if(bioBtn)bioBtn.onclick=function(ev){if(ev)ev.stopPropagation();handleBio();};

    // 整个锁屏区域点击都触发指纹
    if(lsc)lsc.onclick=function(ev){
      var t=ev.target;
      if(!t)return;
      if(t.id==='pwdToggleBtn')return;
      if(t===bioBtn||(bioBtn&&bioBtn.contains&&bioBtn.contains(t)))return;
      handleBio();
    };

    var pt=$('pwdToggleBtn');
    if(pt)pt.onclick=function(ev){
      if(ev)ev.stopPropagation();
      state.showPwdForm=true;
      renderLock();
    };
    return;
  }

  /* ===== 主密码模式 ===== */
  lt.textContent='输入主密码';
  ls.textContent=useBio?'或返回使用指纹解锁':'解锁你的保险箱';
  var backLink=useBio?'<div class="pwd-toggle-link" id="backBioBtn">'+I.finger+' 返回指纹解锁</div>':'';
  lf.innerHTML=
    '<input type="password" id="lockInput" class="lock-input" placeholder="主密码">'
    +'<button class="lock-btn" id="lockBtn">解锁</button>'
    +backLink
    +'<div class="lock-forgot" id="forgotBtn">忘记主密码？</div>';

  var btn2=$('lockBtn');
  if(btn2)btn2.onclick=function(ev){
    if(ev)ev.stopPropagation();
    var p=$('lockInput').value;
    if(simpleHash(p)===state.masterHash){unlock();}
    else{le.textContent='主密码错误';try{$('lockInput').value='';$('lockInput').focus();}catch(e){}}
  };
  var li=$('lockInput');
  if(li){
    setTimeout(function(){try{li.focus();}catch(e){}},300);
    li.onkeydown=function(ev){if(ev.key==='Enter'){try{$('lockBtn').click();}catch(e){}}};
    li.addEventListener('click',function(ev){ev.stopPropagation();});
  }
  var back=$('backBioBtn');
  if(back)back.onclick=function(ev){
    if(ev)ev.stopPropagation();
    state.showPwdForm=false;
    renderLock();
  };
  var fb=$('forgotBtn');
  if(fb)fb.onclick=function(ev){
    if(ev)ev.stopPropagation();
    askConfirm('清空所有数据？','忘记主密码将无法恢复。继续将清空所有密码并重置保险箱。',function(){
      store.remove(KEY_ITEMS);store.remove(KEY_MASTER);store.remove(KEY_TRASH);store.remove(KEY_BIO);
      state.items=[];state.trash=[];state.masterHash=null;
      state.bioEnabled=false;state.bioCredId=null;state.showPwdForm=false;
      state.firstSetup=true;renderLock();
    });
  };
}

/* 首次创建后的指纹引导 */
function showBioSetupGuide(){
  var lt=$('lockTitle'),ls=$('lockSub'),le=$('lockErr'),lf=$('lockForm'),lsc=$('lockScreen');
  if(lsc)lsc.onclick=null;
  le.textContent='';
  lt.textContent='开启指纹解锁';
  ls.textContent='下次打开即可一触进入';
  lf.innerHTML=
    '<button class="bio-btn" id="bioBtn" type="button">'+I.finger+'</button>'
    +'<div class="bio-hint" id="bioHint">点击指纹图标完成设置</div>'
    +'<button class="lock-btn" id="skipBioBtn" style="margin-top:16px;background:rgba(255,255,255,.08);color:#94a3b8">暂不开启，使用主密码</button>';

  var bioBtn=$('bioBtn'),bioHint=$('bioHint');
  if(bioBtn)bioBtn.onclick=function(ev){
    if(ev)ev.stopPropagation();
    bioBtn.className='bio-btn loading';
    if(bioHint){bioHint.className='bio-hint';bioHint.textContent='正在设置指纹...';}
    registerBiometric().then(function(res){
      if(res.ok){
        state.bioEnabled=true;state.bioCredId=res.credId;
        saveBio();
        toast('指纹解锁已开启');
        unlock();
      }else{
        bioBtn.className='bio-btn error';
        if(bioHint){bioHint.className='bio-hint error';bioHint.textContent=res.reason||'设置失败';}
        setTimeout(function(){
          bioBtn.className='bio-btn';
          if(bioHint){bioHint.className='bio-hint';bioHint.textContent='点击指纹图标完成设置';}
        },2000);
      }
    });
  };
  var skip=$('skipBioBtn');
  if(skip)skip.onclick=function(ev){
    if(ev)ev.stopPropagation();
    toast('可在设置中随时开启指纹');
    unlock();
  };
}

function unlock(){
  state.locked=false;state.lastActivity=Date.now();
  try{$('lockScreen').className='lock-screen hidden';}catch(e){}
  switchTab(state.tab);
}
function lock(){
  if(state.firstSetup)return;
  closeAllDrawers();closeConfirm();
  state.locked=true;vClear();clearSelection();state.batchMode=false;
  state.showPwdForm=false;  // 每次锁屏默认回到指纹模式
  for(var k in state.totpIntervals){if(state.totpIntervals.hasOwnProperty(k)){clearInterval(state.totpIntervals[k]);}}
  state.totpIntervals={};
  try{$('lockScreen').className='lock-screen';}catch(e){}
  renderLock();
}

/* ========== 指纹开关 ========== */
function enableBioFromSettings(){
  if(!bioDiag.ok){toast(bioDiag.reason||'当前环境不支持指纹');return;}
  if(!platformAuthAvailable){
    try{
      PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(v){
        if(!v){toast('设备未录入指纹或不支持');return;}
        platformAuthAvailable=true;doRegister();
      }).catch(function(){toast('检测设备指纹失败');});
    }catch(e){toast('检测设备指纹失败');}
    return;
  }
  doRegister();
}
function doRegister(){
  toast('请在系统弹窗中验证指纹');
  registerBiometric().then(function(res){
    if(res.ok){
      state.bioEnabled=true;state.bioCredId=res.credId;saveBio();
      toast('指纹解锁已开启');renderSettings();
    }else{
      toast(res.reason||'开启失败');renderSettings();
    }
  });
}
function disableBio(){
  state.bioEnabled=false;state.bioCredId=null;saveBio();
  toast('指纹解锁已关闭');renderSettings();
}

/* ========== Tab ========== */
function switchTab(tab){
  state.tab=tab;
  try{
    var pages=document.getElementsByClassName('tab-page');
    for(var i=0;i<pages.length;i++)pages[i].className='tab-page';
    var pg=$('tab'+tab.charAt(0).toUpperCase()+tab.slice(1));
    if(pg)pg.className='tab-page active';
    var navs=document.getElementsByClassName('nav-btn');
    for(var j=0;j<navs.length;j++)navs[j].className=navs[j].getAttribute('data-tab')===tab?'nav-btn active':'nav-btn';
    var titles={vault:['保险箱','本地加密 · Pro'],generator:['生成器','高强度随机密码'],security:['安全中心','密码健康度总览'],settings:['设置','偏好与数据管理']};
    var kickers={vault:'本地加密 · Pro',generator:'密码生成',security:'安全报告',settings:'偏好设置'};
    if(titles[tab]){$('pageTitle').textContent=titles[tab][0];$('pageKicker').textContent=kickers[tab];}
    if(tab==='vault'){renderChips();renderList();}

    $('fab').style.display=tab==='vault'?'flex':'none';

}

/* ========== 保险箱 ========== */
function renderChips(){
  try{
    var html='';
    for(var i=0;i<CATS.length;i++){var c=CATS[i];var a=state.cat===c.id?' active':'';html+='<button class="chip'+a+'" data-cat="'+c.id+'">'+c.label+'</button>';}

function renderRecent(){
  try{
    var recent=[];for(var i=0;i<state.items.length;i++){if(state.items[i].lastUsedAt>0)recent.push(state.items[i]);}

    scroll.innerHTML=html;

    for(var c=0;c<chips.length;c++){chips[c].onclick=function(){openDetail(this.getAttribute('data-id'));};}

}
function renderList(){
  try{
    var sf=$('starFilterBtn');if(sf)sf.className='mini-tool starred'+(state.starFilter?' active':'');
    var bb=$('batchBtn');if(bb)bb.className='mini-tool'+(state.batchMode?' active':'');
    var bar=$('batchBar');if(bar)bar.className='batch-bar'+(state.batchMode?' show':'');
    var bc=$('bbCount');if(bc)bc.textContent='已选 '+selectedCount()+' 项';
    renderRecent();
    var list=[];
    for(var i=0;i<state.items.length;i++){
      var x=state.items[i];
      if(state.cat!=='all'&&x.cat!==state.cat)continue;
      if(state.starFilter&&!x.favorite)continue;
      if(state.keyword){
        var k=state.keyword.toLowerCase();var m=false;
        if(x.service.toLowerCase().indexOf(k)!==-1)m=true;
        if((x.user||'').toLowerCase().indexOf(k)!==-1)m=true;
        if((x.note||'').toLowerCase().indexOf(k)!==-1)m=true;
        var cm=CAT_MAP[x.cat];if(cm&&cm.label.indexOf(state.keyword)!==-1)m=true;
        if(!m)continue;
      }
      list.push(x);
    }
    var sortBy=state.sortBy;
    list.sort(function(a,b){
      if(sortBy==='name')return a.service.localeCompare(b.service);
      if(sortBy==='created')return b.createdAt-a.createdAt;
      if(sortBy==='used')return (b.lastUsedAt||0)-(a.lastUsedAt||0);
      return b.updatedAt-a.updatedAt;
    });
    var el=$('vaultList');
    if(list.length===0){
      if(state.items.length===0)el.innerHTML='<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="empty-title">保险箱是空的</div><div class="empty-desc">点击下方 + 按钮，添加你的第一个密码</div></div>';
      else el.innerHTML='<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div><div class="empty-title">没有匹配结果</div><div class="empty-desc">试试其他关键词或筛选条件</div></div>';
      return;
    }
    var html='';
    for(var j=0;j<list.length;j++){
      var it=list[j];var isV=vHas(it.id);var st=pwdStrength(it.pwd);var cat=CAT_MAP[it.cat]||CAT_MAP.other;
      var pwdShow=isV?esc(it.pwd):new Array(Math.min(it.pwd.length,14)+1).join('•')+(it.pwd.length>14?'••':'');
      var cardCls='card'+(state.batchMode?' batch':'')+(isSelected(it.id)?' checked':'');
      var meta=esc(it.user)||'—';if(it.totp)meta+=' · TOTP';
      html+='<div class="'+cardCls+'" data-id="'+it.id+'" style="animation-delay:'+Math.min(j*25,180)+'ms">'
        +'<div class="card-check"></div>'
        +'<div class="card-head">'
        +'<div class="avatar '+cat.cls+'">'+esc(cat.label.charAt(0))+'</div>'
        +'<div class="card-meta"><div class="card-service">'+esc(it.service)+'</div><div class="card-user">'+meta+'<span class="sep"></span>'+timeAgo(it.updatedAt)+'</div></div>'
        +'<button class="star-btn'+(it.favorite?' active':'')+'" data-act="star" data-id="'+it.id+'">'+I.star+'</button>'
        +'</div>'

/* ========== 安全中心 ========== */
function renderSecurity(){
  try{
    var total=state.items.length;
    var weak=[],dupGroups=[],old=[],fav=[];var pwdMap={};var expireMs=state.settings.expireDays*864e5;var catCount={};
    for(var i=0;i<state.items.length;i++){var x=state.items[i];
      if(pwdStrength(x.pwd)===1)weak.push(x);
      if(x.favorite)fav.push(x);
      if(Date.now()-x.updatedAt>expireMs)old.push(x);
      if(!pwdMap[x.pwd])pwdMap[x.pwd]=[];pwdMap[x.pwd].push(x);
      catCount[x.cat]=(catCount[x.cat]||0)+1;
    }
    for(var k in pwdMap){if(pwdMap.hasOwnProperty(k)&&pwdMap[k].length>1)dupGroups.push(pwdMap[k]);}
    var dedWeak=weak.length*8;var dedDup=dupGroups.length*5;var dedOld=old.length*3;
    var score=total===0?100:Math.max(0,Math.min(100,100-dedWeak-dedDup-dedOld));
    var scoreColor=score>=80?'#34d399':score>=55?'#fbbf24':'#f43f5e';
    var scoreText=score>=80?'非常安全':score>=55?'需要关注':'存在风险';
    var circ=2*3.14159*46;
    var html='<div class="score-card">'
      +'<div class="score-ring"><svg viewBox="0 0 110 110"><circle class="ring-bg" cx="55" cy="55" r="46"/><circle class="ring-fg" cx="55" cy="55" r="46" id="ringFg" stroke="'+scoreColor+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'"/></svg>'
      +'<div class="score-center"><div class="score-num" style="color:'+scoreColor+'">'+score+'</div><div class="score-label">安全评分</div></div></div>'
      +'<div class="score-info"><h3 style="color:'+scoreColor+'">'+scoreText+'</h3>'
      +'<div class="deduction-list">'
      +'<div class="deduction-item"><span>弱密码</span><span class="dv '+(dedWeak>0?'bad':'ok')+'">-'+(dedWeak||0)+'</span></div>'
      +'<div class="deduction-item"><span>重复使用</span><span class="dv '+(dedDup>0?'warn':'ok')+'">-'+(dedDup||0)+'</span></div>'
      +'<div class="deduction-item"><span>过期未更新</span><span class="dv '+(dedOld>0?'warn':'ok')+'">-'+(dedOld||0)+'</span></div>'
      +'</div></div></div>';
    var hasAny=false;for(var cc in catCount){if(catCount.hasOwnProperty(cc)&&catCount[cc]>0){hasAny=true;break;}}
    if(hasAny){
      html+='<div class="dist-card"><h4><span>分类分布</span><span style="color:var(--txt-3);font-weight:500">'+total+' 个</span></h4>';
      var distColors={social:'#8b5cf6',mail:'#3b82f6',bank:'#10b981',shop:'#f59e0b',work:'#06b6d4',other:'#64748b'};
      var catOrder=['social','mail','bank','shop','work','other'];
      for(var oi=0;oi<catOrder.length;oi++){var catId=catOrder[oi];var cnt=catCount[catId]||0;if(cnt===0)continue;var cm=CAT_MAP[catId];var pct=Math.round(cnt/total*100);html+='<div class="dist-row"><div class="dist-label">'+cm.label+'</div><div class="dist-bar-wrap"><div class="dist-bar" style="width:'+pct+'%;background:'+distColors[catId]+'"></div></div><div class="dist-value">'+cnt+'</div></div>';}
      html+='</div>';
    }
    html+='<div class="stat-grid">'
      +'<div class="stat-item"><div class="sv" style="color:var(--txt-1)">'+total+'</div><div class="sl">全部</div></div>'
      +'<div class="stat-item t-ok"><div class="sv">'+(total-weak.length)+'</div><div class="sl">强/中</div></div>'
      +'<div class="stat-item t-bad"><div class="sv">'+weak.length+'</div><div class="sl">弱密码</div></div>'
      +'<div class="stat-item t-fav"><div class="sv">'+fav.length+'</div><div class="sl">收藏</div></div>'
      +'</div>';
    html+=buildIssue('弱密码','danger',I.warn,weak.length,mapIssue(weak,'建议立即更换'));
    var dupFlat=[];for(var d=0;d<dupGroups.length;d++){for(var dd=0;dd<dupGroups[d].length;dd++){dupFlat.push({id:dupGroups[d][dd].id,name:dupGroups[d][dd].service,sub:'重复密码组（'+dupGroups[d].length+'个）',cat:dupGroups[d][dd].cat});}}
    html+=buildIssue('重复使用的密码','warn',I.dup,dupFlat.length,dupFlat);
    html+=buildIssue('超过 '+state.settings.expireDays+' 天未更新','info',I.clock,old.length,mapIssue(old,'建议定期更换'));
    $('securityPage').innerHTML=html;
    setTimeout(function(){try{var r=$('ringFg');if(r)r.setAttribute('stroke-dashoffset',circ*(1-score/100));}catch(e){}},100);
    var heads=$('securityPage').getElementsByClassName('issue-head');
    for(var h=0;h<heads.length;h++){heads[h].onclick=function(){var g=this.parentNode;g.className=g.className.indexOf('expanded')!==-1?'issue-group':'issue-group expanded';};}
    var items=$('securityPage').getElementsByClassName('issue-item');
    for(var m=0;m<items.length;m++){items[m].onclick=function(){openDetail(this.getAttribute('data-id'));};}
  }catch(e){console.error('renderSecurity',e);try{$('securityPage').innerHTML='<div style="padding:20px;color:#fda4af">加载失败: '+esc(e.message)+'</div>';}catch(e2){}}
}
function mapIssue(arr,defaultSub){var r=[];for(var i=0;i<arr.length;i++){r.push({id:arr[i].id,name:arr[i].service,sub:arr[i].user||defaultSub,cat:arr[i].cat});}return r;}
function buildIssue(title,type,icon,count,items){
  var body;
  if(count===0)body='<div class="issue-empty">✓ 未发现问题</div>';
  else{var rows='';var lim=Math.min(items.length,20);for(var i=0;i<lim;i++){var x=items[i];var cat=CAT_MAP[x.cat]||CAT_MAP.other;rows+='<div class="issue-item" data-id="'+x.id+'"><div class="ii-avatar '+cat.cls+'">'+esc(cat.label.charAt(0))+'</div><div class="ii-meta"><div class="ii-name">'+esc(x.name)+'</div><div class="ii-sub">'+esc(x.sub)+'</div></div></div>';}body=rows;}
  return '<div class="issue-group"><div class="issue-head"><div class="issue-icon '+type+'">'+icon+'</div><h4>'+title+'</h4><span class="count">'+count+'</span></div><div class="issue-body">'+body+'</div></div>';
}

function updatePwdHint(pwd){

    var hint=$('pwdHint'),text=$('pwdHintText');if(!hint||!text)return;

    text.textContent=lv===3?'强密码':lv===2?'中等强度':'弱密码';
  }catch(e){}

function saveForm(){
  try{
    var service=$('inService').value.trim();var user=$('inUser').value.trim();var pwd=$('inPwd').value.trim();
    var note=$('inNote').value.trim();var totp=$('inTotp').value.trim();
    var activePill=null;var pills=$('pills').getElementsByClassName('pill');
    for(var i=0;i<pills.length;i++){if(pills[i].className.indexOf('active')!==-1){activePill=pills[i];break;}}
    var cat=activePill?activePill.getAttribute('data-cat'):'other';
    if(!service){toast('请输入服务名称');return;}
    if(!user){toast('请输入账号');return;}
    if(!pwd){toast('请输入密码');return;}
    if(pwd.length<4){toast('密码太短了');return;}
    if(state.editingId){
      for(var k=0;k<state.items.length;k++){
        if(state.items[k].id===state.editingId){
          if(state.items[k].pwd!==pwd){
            if(!state.items[k].history)state.items[k].history=[];
            state.items[k].history.unshift({pwd:state.items[k].pwd,changedAt:Date.now()});
            if(state.items[k].history.length>5)state.items[k].history=state.items[k].history.slice(0,5);
          }
          state.items[k].service=service;state.items[k].user=user;state.items[k].pwd=pwd;
          state.items[k].cat=cat;state.items[k].note=note;state.items[k].totp=totp;
          state.items[k].updatedAt=Date.now();
          break;
        }
      }
      state.editingId=null;toast('已保存修改');
    }else{
      state.items.push({id:uid(),service:service,user:user,pwd:pwd,cat:cat,favorite:false,note:note,totp:totp,lastUsedAt:0,history:[],createdAt:Date.now(),updatedAt:Date.now()});
      toast('已保存到保险箱');
    }
    saveItems();closeFormDrawer();switchTab('vault');
  }catch(e){console.error('saveForm',e);toast('保存失败');}
}
function submitMasterChange(){

    var op=$('oldMaster').value;var n1=$('newMaster1').value;var n2=$('newMaster2').value;
    if(simpleHash(op)!==state.masterHash){toast('当前主密码错误');return;}
    if(n1.length<6){toast('新密码至少 6 位');return;}

  }catch(e){toast('修改失败');}
}

    html+='<div class="detail-block"><div class="db-body"><div class="db-label">账号</div><div class="db-value">'+(esc(it.user)||'—')+'</div></div><button class="mini-btn" data-act="copyUser">'+I.copy+'</button></div>';
    html+='<div class="detail-block"><div class="db-body"><div class="db-label">密码 <span class="strength s'+st+'" style="display:inline-flex;margin-left:6px;vertical-align:middle"><i></i><i></i><i></i></span></div><div class="db-value mono">'+pwdDisplay+'</div></div><button class="mini-btn" data-act="toggle">'+(isV?I.eyeOff:I.eye)+'</button><button class="mini-btn" data-act="copyPwd">'+I.copy+'</button></div>';
    if(it.note){html+='<div class="detail-block" style="flex-direction:column;align-items:stretch"><div class="db-label">备注</div><div class="db-value" style="font-weight:400;font-size:.82rem;color:var(--txt-2);line-height:1.5;white-space:pre-wrap">'+esc(it.note)+'</div></div>';}
    html+='<div class="detail-block" style="flex-direction:column;align-items:stretch"><div class="db-label">密码强度分析</div><div class="analysis-row">'
      +'<div class="analysis-item '+(an.len>=8?'ok':'no')+'"><div class="av">'+an.len+'</div><div class="al">长度</div></div>'
      +'<div class="analysis-item '+(an.hasLower?'ok':'no')+'"><div class="av">'+(an.hasLower?'✓':'✗')+'</div><div class="al">小写</div></div>'
      +'<div class="analysis-item '+(an.hasUpper?'ok':'no')+'"><div class="av">'+(an.hasUpper?'✓':'✗')+'</div><div class="al">大写</div></div>'
      +'<div class="analysis-item '+(an.hasNumber?'ok':'no')+'"><div class="av">'+(an.hasNumber?'✓':'✗')+'</div><div class="al">数字</div></div>'
      +'<div class="analysis-item '+(an.hasSymbol?'ok':'no')+'"><div class="av">'+(an.hasSymbol?'✓':'✗')+'</div><div class="al">符号</div></div>'
      +'</div></div>';
    if(it.totp){html+='<div class="detail-block" style="flex-direction:column;align-items:stretch"><div class="db-label">二次验证码 TOTP</div><div class="totp-code" id="totpCode-'+it.id+'">------</div><div class="totp-timer"><span id="totpTimer-'+it.id+'" style="width:100%"></span></div></div>';}
    if(it.history&&it.history.length>0){html+='<div class="detail-block" style="flex-direction:column;align-items:stretch"><div class="db-label">密码修改历史</div>';for(var h=0;h<it.history.length;h++){html+='<div class="history-item"><div class="h-time">'+new Date(it.history[h].changedAt).toLocaleString()+'</div><div class="h-pwd">'+esc(it.history[h].pwd)+'</div></div>';}html+='</div>';}
    html+='<div class="detail-block" style="flex-direction:column;align-items:stretch;gap:5px"><div style="display:flex;justify-content:space-between;font-size:.68rem;color:var(--txt-3)"><span>创建时间</span><span>'+new Date(it.createdAt).toLocaleString()+'</span></div><div style="display:flex;justify-content:space-between;font-size:.68rem;color:var(--txt-3)"><span>最后更新</span><span>'+new Date(it.updatedAt).toLocaleString()+'</span></div></div>';
    html+='<div class="detail-actions"><button class="btn-fav" id="detailFav">'+I.star+' '+(it.favorite?'取消收藏':'收藏')+'</button><button class="btn-edit" id="detailEdit">'+I.edit+' 编辑</button><button class="btn-del" id="detailDel">'+I.del+'</button></div>';
    $('detailBody').innerHTML=html;
    if(it.totp){
      if(state.totpIntervals[it.id])clearInterval(state.totpIntervals[it.id]);
      var updateTotp=function(){
        var codeEl=$('totpCode-'+it.id);var timerEl=$('totpTimer-'+it.id);if(!codeEl)return;
        generateTOTP(it.totp,30).then(function(code){if(code)codeEl.textContent=code.substring(0,3)+' '+code.substring(3);else codeEl.textContent='密钥无效';});
        var epoch=Math.floor(Date.now()/1000);var remain=30-(epoch%30);if(timerEl)timerEl.style.width=(remain/30*100)+'%';
      };
      updateTotp();state.totpIntervals[it.id]=setInterval(updateTotp,1000);
    }
    var acts=$('detailBody').getElementsByClassName('mini-btn');
    for(var a=0;a<acts.length;a++){
      acts[a].onclick=function(){
        var act=this.getAttribute('data-act');
        if(act==='toggle'){if(vHas(it.id))vDel(it.id);else vAdd(it.id);openDetail(it.id);if(state.tab==='vault')renderList();}
        else if(act==='copyPwd'){copySecure(it.pwd,function(ok){toast(ok?'已复制，30 秒后自动清除':'复制失败');});}
        else if(act==='copyUser'){copySecure(it.user,function(ok){toast(ok?'已复制，30 秒后自动清除':'复制失败');});}
      };
    }
    $('detailFav').onclick=function(){toggleFavorite(it.id);openDetail(it.id);};
    $('detailEdit').onclick=function(){closeDrawer($('detailDrawer'));setTimeout(function(){openFormDrawer('edit',it.id);},250);};
    $('detailDel').onclick=function(){
      askConfirm('移入回收站？','"'+esc(it.service)+'" 将移入回收站，30 天内可恢复。',function(){
        var target=null;var newItems=[];
        for(var i=0;i<state.items.length;i++){if(state.items[i].id===it.id)target=state.items[i];else newItems.push(state.items[i]);}
        if(target){target.deletedAt=Date.now();state.trash.push(target);saveTrash();}
        state.items=newItems;vDel(it.id);saveItems();closeDrawer($('detailDrawer'));toast('已移入回收站');switchTab(state.tab);
      });
    };
    openDrawer($('detailDrawer'));
  }catch(e){console.error('openDetail',e);toast('打开详情失败');}
}

/* ========== 回收站 ========== */
function openTrash(){renderTrash();openDrawer($('trashDrawer'));}
function renderTrash(){
  try{
    var body=$('trashBody');var sub=$('trashSub');if(!body)return;
    if(sub)sub.textContent=state.trash.length>0?'共 '+state.trash.length+' 项，30 天内可恢复':'暂无已删除的项目';
    if(state.trash.length===0){body.innerHTML='<div class="trash-empty">回收站是空的</div>';return;}
    var html='';
    for(var i=0;i<state.trash.length;i++){
      var t=state.trash[i];var cat=CAT_MAP[t.cat]||CAT_MAP.other;
      var daysLeft=Math.ceil((30*864e5-(Date.now()-t.deletedAt))/864e5);
      html+='<div class="trash-item" data-id="'+t.id+'"><div class="ti-head"><div class="ti-avatar '+cat.cls+'">'+esc(cat.label.charAt(0))+'</div><div class="ti-name">'+esc(t.service)+'</div><div class="ti-time">'+daysLeft+'天后过期</div></div><div class="ti-actions"><button class="trash-restore" data-act="restore" data-id="'+t.id+'">恢复</button><button class="trash-del" data-act="permanent" data-id="'+t.id+'">永久删除</button></div></div>';
    }
    body.innerHTML=html;
    var btns=body.getElementsByTagName('button');
    for(var b=0;b<btns.length;b++){
      btns[b].onclick=function(){
        var id=this.getAttribute('data-id');var act=this.getAttribute('data-act');
        if(act==='restore'){
          var target=null;var newTrash=[];
          for(var i=0;i<state.trash.length;i++){if(state.trash[i].id===id)target=state.trash[i];else newTrash.push(state.trash[i]);}
          if(target){delete target.deletedAt;target.updatedAt=Date.now();state.items.push(target);state.trash=newTrash;saveItems();saveTrash();toast('已恢复到保险箱');renderTrash();if(state.tab==='vault')renderList();if(state.tab==='settings')renderSettings();}
        }else if(act==='permanent'){
          askConfirm('永久删除？','此操作不可恢复。',function(){
            var newTrash=[];for(var i=0;i<state.trash.length;i++){if(state.trash[i].id!==id)newTrash.push(state.trash[i]);}
            state.trash=newTrash;saveTrash();toast('已永久删除');renderTrash();if(state.tab==='settings')renderSettings();
          });
        }
      };
    }
  }catch(e){console.error('renderTrash',e);}
}

function enterBatchMode(){state.batchMode=true;clearSelection();renderList();}
function exitBatchMode(){state.batchMode=false;clearSelection();renderList();}

function openDrawer(el){try{$('overlay').className='overlay open';el.className='drawer open';}catch(e){}}
function closeDrawer(el){try{el.className='drawer';}catch(e){}}
function closeAllDrawers(){try{$('overlay').className='overlay';$('formDrawer').className='drawer';$('detailDrawer').className='drawer';$('importDrawer').className='drawer';$('exportDrawer').className='drawer';$('trashDrawer').className='drawer';}catch(e){}}
function askConfirm(title,text,onYes){try{$('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirmDialog').className='confirm open';$('overlay').className='overlay open';state.pendingConfirm=onYes;}catch(e){}}
function closeConfirm(){try{$('confirmDialog').className='confirm';if($('formDrawer').className.indexOf('open')===-1&&$('detailDrawer').className.indexOf('open')===-1&&$('importDrawer').className.indexOf('open')===-1&&$('exportDrawer').className.indexOf('open')===-1&&$('trashDrawer').className.indexOf('open')===-1)$('overlay').className='overlay';state.pendingConfirm=null;}catch(e){}}

function touchActivity(){state.lastActivity=Date.now();}

/* ========== 导入/导出 ========== */
function doExport(){
  var pass=$('exportPass').value;
  if(pass.length<6){toast('导出密码至少 6 位');return;}
  var plaintext=JSON.stringify({app:'密码保险箱',version:13,exportedAt:new Date().toISOString(),items:state.items});
  if(!hasCrypto){if(confirm('当前环境不支持 Web Crypto，将导出明文 JSON。继续？')){$('exportText').value=plaintext;toast('已生成明文备份');}return;}
  aesEncrypt(plaintext,pass).then(function(c){$('exportText').value=c;toast('加密备份已生成');}).catch(function(){toast('加密失败');});
}
function doImport(){
  try{
    var text=$('importText').value.trim();if(!text){toast('请粘贴备份内容');return;}
    var parsed=null;try{parsed=JSON.parse(text);}catch(e){}
    if(parsed&&parsed.items){importItems(parsed.items);return;}
    var pwd=$('importPass').value;if(!pwd){toast('请输入备份密码');return;}
    aesDecrypt(text,pwd).then(function(plain){var data=JSON.parse(plain);if(data&&data.items)importItems(data.items);else toast('备份格式不正确');}).catch(function(){toast('解密失败：密码错误或备份损坏');});
  }catch(e){toast('解析失败');}
}
function importItems(arr){
  var imported=0;
  for(var i=0;i<arr.length;i++){
    var x=arr[i];if(!x||!x.service)continue;
    var exists=false;
    for(var j=0;j<state.items.length;j++){if(state.items[j].service===x.service&&state.items[j].user===x.user){exists=true;break;}}
    if(exists)continue;
    state.items.push({id:x.id||uid(),service:x.service,user:x.user||'',pwd:x.pwd||'',cat:x.cat||guessCat(x.service),favorite:x.favorite===true,note:x.note||'',totp:x.totp||'',lastUsedAt:0,history:x.history||[],createdAt:x.createdAt||Date.now(),updatedAt:x.updatedAt||Date.now()});
    imported++;
  }
  saveItems();closeDrawer($('importDrawer'));toast('已导入 '+imported+' 条记录');switchTab('vault');
}

/* ========== 初始化 ========== */
function init(){
  setProgress('正在读取数据...');loadAll();
  setProgress('正在应用主题...');applyTheme(state.settings.theme||'dark');
  setProgress('正在检测指纹...');checkPlatformAuth();
  setProgress('正在渲染界面...');renderLock();

  try{var evts=['click','touchstart','keydown','input'];for(var e=0;e<evts.length;e++)document.addEventListener(evts[e],touchActivity,false);}catch(e){}
  try{var navs=document.getElementsByClassName('nav-btn');for(var n=0;n<navs.length;n++){(function(btn){btn.onclick=function(){switchTab(btn.getAttribute('data-tab'));};})(navs[n]);}}catch(e){}
  try{var si=$('searchInput');if(si)si.oninput=function(){state.keyword=this.value.trim();renderList();};}catch(e){}
  try{var ss=$('sortSelect');if(ss)ss.onchange=function(){state.sortBy=this.value;renderList();};}catch(e){}
  try{var sf=$('starFilterBtn');if(sf)sf.onclick=function(){state.starFilter=!state.starFilter;renderList();};}catch(e){}
  try{
    $('batchBtn').onclick=function(){if(state.batchMode)exitBatchMode();else enterBatchMode();};
    $('bbCancel').onclick=exitBatchMode;
    $('bbAll').onclick=function(){for(var i=0;i<state.items.length;i++)state.selected[state.items[i].id]=true;renderList();};
    $('bbDel').onclick=function(){
      var cnt=selectedCount();if(cnt===0){toast('请先选择项目');return;}
      askConfirm('移入回收站？','将移除 '+cnt+' 条记录（30 天内可恢复）。',function(){
        var newItems=[];
        for(var i=0;i<state.items.length;i++){if(isSelected(state.items[i].id)){state.items[i].deletedAt=Date.now();state.trash.push(state.items[i]);}else newItems.push(state.items[i]);}
        state.items=newItems;clearSelection();state.batchMode=false;saveItems();saveTrash();toast('已移入回收站 '+cnt+' 条');switchTab('vault');
      });
    };
  }catch(e){}
  try{$('fab').onclick=function(){openFormDrawer('add');};}catch(e){}
  try{$('lockNowBtn').onclick=function(){lock();};}catch(e){}
  try{$('themeToggleBtn').onclick=function(){applyTheme(state.settings.theme==='dark'?'light':'dark');if(state.tab==='settings')renderSettings();};}catch(e){}
  try{
    $('genLen').oninput=function(){state.genLen=parseInt(this.value,10)||16;try{$('genLenVal').textContent=state.genLen;}catch(e){}};
    var rows=document.querySelectorAll('.toggle-row');
    for(var r=0;r<rows.length;r++){(function(row){row.onclick=function(){var opt=row.getAttribute('data-opt');state.genOpts[opt]=!state.genOpts[opt];renderGenerator();};})(rows[r]);}
    $('genRefresh').onclick=generateNew;
    $('genCopy').onclick=function(){if(!state.genPwd){toast('请先生成密码');return;}copySecure(state.genPwd,function(ok){toast(ok?'已复制，30 秒后自动清除':'复制失败');});};
  }catch(e){}
  try{$('overlay').onclick=function(){if($('confirmDialog').className.indexOf('open')!==-1){closeConfirm();return;}closeAllDrawers();closeConfirm();};}catch(e){}
  try{
    $('confirmNo').onclick=closeConfirm;
    $('confirmYes').onclick=function(){
      var fn=state.pendingConfirm;
      try{$('confirmDialog').className='confirm';if($('formDrawer').className.indexOf('open')===-1&&$('detailDrawer').className.indexOf('open')===-1&&$('importDrawer').className.indexOf('open')===-1&&$('exportDrawer').className.indexOf('open')===-1&&$('trashDrawer').className.indexOf('open')===-1)$('overlay').className='overlay';}catch(e){}
      state.pendingConfirm=null;if(fn){try{fn();}catch(e){console.error(e);}}
    };
  }catch(e){}
  try{$('exportGenBtn').onclick=doExport;}catch(e){}
  try{$('exportCopyBtn').onclick=function(){var v=$('exportText').value;if(!v){toast('请先生成备份');return;}copySecure(v,function(ok){toast(ok?'已复制':'复制失败');});};}catch(e){}
  try{$('doImportBtn').onclick=doImport;}catch(e){}
  try{setInterval(function(){try{if(state.locked||state.firstSetup)return;if(state.settings.autoLockMin===0)return;if(Date.now()-state.lastActivity>state.settings.autoLockMin*60000)lock();}catch(e){}},10000);}catch(e){}
  try{
    document.addEventListener('visibilitychange',function(){
      try{
        if(document.hidden){if(!state.locked&&!state.firstSetup){var pm=$('privacyMask');if(pm)pm.className='privacy-mask show';}}
        else{var pm2=$('privacyMask');if(pm2)pm2.className='privacy-mask';touchActivity();}
      }catch(e){}
    },false);
  }catch(e){}
  setProgress('');
  try{$('lockSub').textContent=state.firstSetup?'设置主密码（至少 6 位）':(state.bioEnabled?'轻触屏幕使用指纹解锁':'输入主密码解锁');}catch(e){}
}

try{init();}
catch(e){
  console.error('MAIN FAILED',e);
  showFatal('主流程出错：<br><b style="color:#fda4af">'+(e&&e.message?esc(e.message):'未知错误')+'</b>'+(e&&e.stack?'<br><br><span style="color:#475569;font-size:.68rem;word-break:break-all">'+esc(e.stack).substring(0,500)+'</span>':''));
}
})();
</script>
</body>
</html>
